  <script id="page-description-data" type="application/json">{"home":{"title":"患者首页","group":"首页","origin":"图示页面","goal":"让患者在首页的一张卡片中记录晨起状态、看到眠宝反馈，并快速找到今日任务与快捷服务。","interactions":["选择晨起状态：写入 moods[当日]，同日禁止再次提交。","首页眠宝文案由商保领取状态和今日用药记录共同计算；点击文案区进入商保或底部服药记录，点击眠宝切换四种预览状态。","快捷服务包含“我的专员”和“用药提醒”；今日任务读取用药与小憩记录。"],"data":"moods[YYYY-MM-DD]：精神饱满 / 有些疲惫 / 需要小睡 / 状态不佳；按本地日期唯一。\ninsuranceStatus：unclaimed / reviewing / claimed；由商保直付页维护。\nmeds[]：day、time、note；hasToday 以 day 判断今日是否记录。\nhomePreviewState：仅当前页面会话使用，不写入持久化数据。","pending":"正式药品名、任务计划、消息提醒和外部服务入口需业务方确认。","logic":"若 moods[今日] 已存在，四个状态按钮全部禁用；不得覆盖当天值。\n首页四态优先级：未领取→unclaimed；审核中→reviewing；已领取且今日无服药→claimed-unrecorded；已领取且今日有服药→claimed-recorded。\n点击眠宝只切换四态预览视图；点击文案区按当前展示态跳转商保页、打开服药底部弹窗或进入服药记录。\n底部弹窗确认用药时仅在今日尚无记录时新增；保存后清除预览覆盖态并重算首页。","modules":[{"title":"首页滚动 Banner","description":"首页标题下展示三张眠宝推荐卡片：健康记录、眠宝帮你、服务权益；可自动轮播、左右滑动、点击箭头或指示点切换。","fields":"homeBanners[]：title、text、action、target、theme；homeBannerIndex、homeBannerPaused：当前会话状态。当前三项为可替换的静态配置。","logic":"每 5 秒循环切换；点击按钮进入对应页面。离开首页清除计时器，返回重新启动；隐藏页面、焦点在轮播内、用户暂停或系统要求减少动态时不自动切换。切换仅更新轮播，不重绘页面或清空编辑内容。隐藏卡片不可获得焦点。业务活动图片、上线时间及运营配置接口待确认。"},{"title":"状态打卡","description":"四档状态选择：精神饱满/有些疲惫/需要小睡/状态不佳；\n选择后下方对应文案变更；","fields":"moods[本地日期]：四档状态之一。\n建议正式字段（待确认）：userId、recordDate、moodCode、createdAt、updatedAt；recordDate 按选定业务时区生成。","logic":"同日只能提交一次；已记录时禁用四个选项。\n\n【B02/B03｜现状】四档仅更新“今天的感受”文字；权益主文案由支付和服药记录决定。当前同日一次，不可修改。\n【建议规则（待确认）】晨起记录按 userId + recordDate 唯一；误选通过“修改当日状态”覆盖原记录而非新增，保留修改时间；未选择时显示引导，已选择时显示选中项。跨日重新计算日期及可选状态。\n【待确认】是否开放修改；四档对应反馈文案与形象配置；晨起反馈与权益信息的排列关系；日期统一北京时间还是用户时区。未确认前不把晨起状态当作疾病判断。"},{"title":"眠宝权益卡","description":"根据商保状态与今日用药记录展示对应文案；点击文案进入下一步，点击眠宝切换预览状态。","fields":"当前字段补齐：insuranceStatus、meds[].day、homePreviewState。\n建议申请字段（待确认）：applicationId、applicationStatus、benefitStatus、updatedAt、rejectReason。","logic":"未领取或审核中进入商保页；已领取未记录打开用药弹窗；已记录进入服药记录。\n\n【A02/D01｜现状】未领取/审核中进入 payment；已领取且今日无记录打开服药弹窗；已记录进入 med。点击眠宝可覆盖展示状态，不改变申请数据。\n【建议规则（待确认）】申请状态与权益可用状态分别保存；approved 只有经权益接口确认可用后才映射“已领取”。审核拒绝显示拒绝原因及重申入口，不能映射已领取。状态成功刷新后统一重算首页与权益中心。\n【待确认】未申请/审核中/已通过/已拒绝分别对应的首页文案、按钮、跳转；通过后是否需激活；多个申请取哪一份；申请服务、失效规则。临时展示状态不作为真实办理依据，正式版是否保留点击切换需确认。"},{"title":"快捷服务","description":"药房地图、线上购药、随访管家、多元支付、用药提醒、不良反应速记、全部记录和我的专员入口。","fields":"各入口对应的目标页面。\n建议入口配置：serviceCode、label、target、enabled、availabilityMessage。","logic":"点击入口进入对应二级页；服务待接入时展示明确状态。\n\n【E05/E03｜建议规则（待确认）】各入口按统一服务配置渲染；可用进入目标页，未接入进入状态说明；失败不生成交易或申请。全部记录范围见 records；我的专员与随访专员的对应关系见 D05。\n【待确认】本期服务范围、入口可见性、不同账号/地区的可用条件。原始图中的积分、社区、惠民保不因概念图或遗留字段自动纳入本期。"},{"title":"今日任务","description":"显示今日用药与小憩任务的计划或完成情况。","fields":"settings.medTime、meds[]、naps[]。\n建议任务字段（待确认）：taskId、taskType、recordDate、targetCount、plannedTimes、status、completedCount；记录关联 taskId。","logic":"保存记录后重新计算任务摘要；点击任务进入对应页面。\n\n【B01/B03/B04｜现状】当日有任一服药记录即完成；小憩只展示条数，没有固定两次任务目标；通知开关仅保存偏好。\n【建议规则（待确认）】今日任务按业务日期和计划生成；完成数按有效记录计算；服药每个计划次数唯一，小憩按有效会话计数。新增、编辑、删除或补记后重新计算对应日期任务；页面再次显示与跨日时刷新摘要。\n【待确认】每日用药次数和小憩目标、有效时长、补记范围、迟到/未执行状态；跨午夜归属；实际提醒服务。完成记录不能代替已按医嘱执行的医学确认。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。"}],"updatedAt":"2026-09-30T09:01:06.520082+00:00"},"special":{"title":"发作性睡病专区","group":"专病管理","origin":"图示页面","goal":"集中记录猝倒、睡眠和自测信息，帮助患者回顾一段时间内的变化。","interactions":["同一张顶部卡片展示本月与今日猝倒记录：月度文案根据与上月的比较生成；点击眠宝循环切换三种预览状态。","今日区域点击快速记录打开底部弹窗，保存后同步刷新两项统计；周趋势切换只更新所选周数据。","测评记录在 ESS/SRSS 间切换；ESS 可进入测评或拍照，SRSS 仅拍照；注意力挑战位于睡眠辅助工具。"],"data":"events[]：id、day、time、duration、trigger、note；day 为本地 YYYY-MM-DD。\nmonthCount(0/-1)：本月与上月已记录事件数量；weekOffset：当前周相对偏移。\nspecialPreviewState：下降 / 上升 / 上月无记录的会话预览覆盖态。\nscalePhotos[]：scale、image、score、day、time；ESS/SRSS 图表按周显示分数。","pending":"正式量表题目、授权、计分规则及拍照识别需确认；照片仅保存在当前浏览器。","logic":"上月记录数=0 时显示无上月记录文案；本月\u003c上月显示下降；本月\u003e上月显示上升；相等显示持平。\n点击眠宝只循环三种预览态；不修改 events。新增猝倒记录后清除预览态并重新计算。\n本月与今日记录同卡片展示；事件保存后同时重算月度和今日统计。\n快速记录与所选周记录列表使用底部弹窗；周切换改变 weekOffset，不改变源记录。\n月度文案仅基于“已记录次数”；不得解释为实际病情或治疗效果。","modules":[{"title":"本月与今日记录","description":"一张卡片展示本月及今日猝倒记录次数、眠宝反馈和快速记录按钮。","fields":"events[].day、本月与上月事件数、今日事件数。\n建议统计参数：periodStart、periodEnd、comparisonStart、comparisonEnd、count、comparisonCount、hasRecordedData。","logic":"月度反馈按已记录次数比较；快速记录保存后同时更新月度和今日统计。\n\n【C03｜现状】本月累计条数直接与上个完整月比较；上月 0 条进入无上月记录文案。统计是已记录次数，不是完整发作次数。\n【建议规则（待确认）】默认对比同等经过天数；展示两个区间及记录次数，用“记录增加/减少/持平”文案。无记录标“无已记录数据”，不推断没有事件。补录、编辑、删除后重算对应日/月，并清除临时展示覆盖态。\n【待确认】等长区间或整月比较、2 月与大小月截止处理、是否要明确记录“无事件”、月度提示文案。正式版不以记录减少直接得出病情改善。"},{"title":"猝倒周期趋势","description":"按周展示每日猝倒次数，支持前后切周与查看所选周记录。","fields":"weekOffset、events[].day。\n建议趋势字段：periodStart、periodEnd、dayCounts[]、selectedWeek；条目按 occurredAt 过滤。","logic":"周一至周日聚合；查看记录从底部弹出所选周列表。\n\n【C04｜现状】周图与底部列表按同一 weekOffset/日期过滤；图表无记录画为 0。\n【建议规则（待确认）】周一至周日，同一周范围同时驱动图表与列表；允许历史周，不允许超过当前周；返回时保留选中周。新增/修改/删除后更新受影响周；无数据显示“该周暂无已记录事件”。\n【待确认】最早查询范围、无记录日是否用空标记、是否加入月份/诱因分析。独立 trend 页的入口和保留范围另行确认。"},{"title":"测评记录","description":"在 ESS 与 SRSS 间切换柱状图；支持进入 ESS 测评和上传量表照片。","fields":"activeScale、ess[]、scalePhotos[]。\n建议量表配置：scaleCode、name、version、sortOrder、enabled、canAnswer、canUpload、canManualScore、scoreMin、scoreMax；记录另含 assessedAt、source、createdAt。","logic":"ESS 可答题或拍照；SRSS 仅拍照；只展示已录入的得分。\n\n【A01/C05/C06/C07｜现状】仅 ESS/SRSS，两箭头切换；ESS 可答题/照片，SRSS 仅照片；同日图值取拼接后的最后一条，无记录画 0，未按发生时间选最新。\n【建议规则（待确认）】按配置清单展示全部量表名称和可滑动卡片；点击名称与滑动同步选中。默认第一项，不循环；切卡同步更新趋势/按钮/照片量表。记录按 assessedAt 归日，同日取发生时间最新一条，时间相同取 createdAt 最新；不按来源固定优先。缺测用空状态，真实 0 分正常展示；不同版本不直接混算。\n【建议规则（待确认）】照片必须绑定所选量表和测评日期；分数按该量表范围校验；不录分只计入照片历史、不计得分趋势；新增/删除后回算当天有效分数。保留全部历史与图片查看入口；上传失败保留输入。\n【待确认】全部量表清单/顺序/版本/评分、默认卡片、循环与卡片布局、各量表支持操作、图表周范围、手填分数修改和照片保存期限。以上均为说明建议，当前页面尚未实现滑动或新增量表。"},{"title":"睡眠辅助工具","description":"小憩闹钟、睡眠日志、注意力挑战、科学小贴士及不良反应记录入口。","fields":"各入口目标页面。\n工具配置：toolCode、target、enabled；小憩/睡眠/测评统一关联 userId。","logic":"点击后进入相应工具或记录页。\n\n【B05/C08/C09/D06｜建议规则（待确认）】各入口复用同一份原始记录；工具页返回健康档案后刷新统计。计时是否继续、睡眠片段分类、挑战中断及速记上报边界按对应工具规则实施。\n【待确认】“辅助工具”本期清单、是否将挑战和不良反应保留在该区域、未接入服务的入口提示。"},{"title":"健康档案导航与页面命名（待实现）","description":"需求补充：底部“专病管理”改为“健康档案”；本模块只描述待实现导航，不调整当前页面。","fields":"当前路由仍为 special；建议 navigationLabel、pageTitle、groupLabel 配置。","logic":"【A01/E06｜最新意见】底部按钮名称改为“健康档案”。\n【建议规则（待确认）】保留路由 special 与已有记录关联，只替换确认范围内的显示名称，不能因改名重建记录。\n【待确认】仅修改 Tab，还是同步页面标题、左侧分组与关联入口。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。"}],"updatedAt":"2026-09-30T09:01:06.520603+00:00"},"ai":{"title":"眠宝帮你","group":"眠宝帮你","origin":"图示页面","goal":"按主题承接药品与疾病相关问题，并引导到合适的人工服务入口。","interactions":["医生形象眠宝在顶部欢迎患者；点击四类问答主题进入对话。","从医患直连区进入复诊预约、随访专员或紧急咨询。","疑似不良反应问题可转至速记页面。"],"data":"chat[]：topic、q、a；topic 为 med / adverse / interaction / faq。","pending":"真实 AI 引擎、审核知识库、引用来源和人工转接服务尚未接入。","logic":"点击主题进入对应 chat 路由；回复使用本地固定文案。\n疑似不良反应只引导速记与人工咨询，不输出诊断或用药调整。","modules":[{"title":"眠宝欢迎区","description":"医生形象眠宝与问候语。","fields":"静态形象与欢迎文案。\n当前为静态欢迎；建议 serviceAvailability 与 contentVersion 若需配置。","logic":"不采集输入，也不触发问答。\n\n【D04/E05｜建议规则（待确认）】欢迎区不创建问答或记录；形象与文案按审核配置展示；服务不可用时智能问答入口应有一致提示。\n【待确认】AI 接入范围、欢迎文案配置和形象版本。"},{"title":"智能问答入口","description":"药品使用、猝倒与不良反应、饮食相互作用、常见问题四类主题。","fields":"topic：med / adverse / interaction / faq。\n建议 topicConfig：topicCode、title、enabled、knowledgeVersion；conversationId 关联 userId。","logic":"按主题进入对应聊天页；不良反应主题可转速记。\n\n【D04/D06｜建议规则（待确认）】四主题进入独立会话；同一知识与审核版本规则适用全部主题。疑似不良反应只提示用户确认转速记，不自动生成报告。接口失败可重试，答复来源按真实数据展示。\n【待确认】对话范围、知识源、人工转接、风险识别与主题切换时历史策略。"},{"title":"医患直连服务","description":"复诊预约、随访专员和紧急咨询三个入口。","fields":"各入口目标页面。\n建议服务配置：serviceCode、provider、workingHours、available、contactMethod。","logic":"进入服务说明或意向表单；不得显示虚构服务结果。\n\n【D05｜建议规则（待确认）】预约、随访、紧急咨询分别依据真实服务能力展示动作；不把意向保存称预约成功；人工不可用显示服务时间与替代入口。专员关联与首页入口统一。\n【待确认】履约主体、在线能力、服务时间、预约或仅意向、紧急入口实际动作。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。"},{"title":"底部文字与语音输入","description":"固定在页面底部；眠宝帮你首页位于底部导航上方，主题聊天页位于底部。输入文字或点击麦克风识别，核对后点击发送。","fields":"question：去首尾空格后非空，最多 2000 字；voiceListening、composeDraft：当前会话；SpeechRecognition/webkitSpeechRecognition，语言 zh-CN。","logic":"语音结果填入输入框，可编辑，不自动发送。再次点击结束识别；离开页面或发送时停止。拒绝授权、没有麦克风、无声音、连接失败分别提示。不支持语音识别时保留文字输入和系统键盘听写提示。首页对话归 faq 主题，与常见问题共用历史；其他主题各自保留历史。当前回复仍使用已有本地文案，未接入真实 AI。浏览器可能使用平台语音服务，实际权限与服务由浏览器控制。"}],"updatedAt":"2026-09-30T09:01:06.520607+00:00"},"rights":{"title":"权益中心","group":"权益中心","origin":"图示页面","goal":"集中展示多元支付与保障服务。","interactions":["顶部显示眠宝创新支付状态卡，按当前本地权益状态映射文案并进入商保直付。","商保直付状态变更后，返回首页应重新计算眠宝权益文案。"],"data":"入口：payment、calculator、welfare；本页不采集输入值。","pending":"保险资格、福利项目与正式服务渠道需接入真实规则。","logic":"顶部状态卡复用 insuranceStatus；其后展示商保直付、商保计算器与特定药品福利三个入口。轮播 Banner 仍为待实现说明。","modules":[{"title":"创新支付状态与眠宝卡","description":"顶部标题下展示眠宝形象、当前创新支付状态、状态说明和操作按钮；按钮进入商保直付页。","fields":"当前读取 insuranceStatus：unclaimed → 未申请，reviewing → 审核中，claimed → 已通过，rejected → 已拒绝。当前本地流程只生成前三态，rejected 为兼容后续状态数据。\n正式申请来源、申请维度及审核接口仍待业务确认。","logic":"【当前实现】进入权益中心实时读取状态；申请或权益状态变更后返回本页重算。未申请→了解申请流程；审核中→查看申请进度；已通过→查看用药权益；已拒绝→查看申请详情，均进入 payment。未知值回退为未申请。未接入真实审核，不生成虚构审核结果。\n【待确认】创新支付是否仅对应商保、通过与权益激活的关系、多份申请/拒绝原因/补件/撤回/重新申请/到期规则；正式状态以真实接口为准。"},{"title":"商保直付入口","description":"进入用药权益状态和申请流程页。","fields":"目标页面 payment。\n建议 serviceCode、applicationId、currentApplication；权益卡与首页读取同一申请数据。","logic":"首页权益卡同步读取该页的状态。\n\n【A02/D01｜建议规则（待确认）】进入商保直付查看本用户对应服务的当前申请；提交/状态更新后返回本页刷新卡片；无资格/服务不可用显示原因，不默认可申请。\n【待确认】资格核验、服务地区、创新支付卡是否汇总该入口、多个申请排序。"},{"title":"商保计算器入口","description":"进入费用与比例的预估计算页。","fields":"目标页面 calculator。\n目标 calculator；预估规则包含 calculationVersion、serviceCode（若接入正式方案）。","logic":"入口不直接计算或判断保险资格。\n\n【D02｜建议规则（待确认）】仅跳计算器；输入和结果不改变申请资格或审核状态；计算器明确金额性质和估算口径。\n【待确认】用户手填比例还是按方案计算、地区/保单数据来源。"},{"title":"特定药品福利入口","description":"进入福利申请流程说明页。","fields":"目标页面 welfare。\n目标 welfare；建议福利单独 serviceType、applicationId，不直接复用商保结果。","logic":"未接入真实申请服务时不生成审核结果。\n\n【D01/E05｜建议规则（待确认）】展示福利适用条件和申请路径；不同服务分别追踪申请，除非业务明确统一办理。服务未接入保持当前状态说明。\n【待确认】福利项目与本期范围、与商保是否可叠加、创新支付卡是否展示福利状态。"},{"title":"权益轮播 Banner（待实现）","description":"最新意见要求自动滚动 Banner；本模块只补需求，当前中间页面不增加轮播。","fields":"建议 bannerId、imageUrl、title、sortOrder、enabled、startAt、endAt、targetType、target、audienceRule。","logic":"【A03｜建议规则（待确认）】仅展示已启用且在有效时间内的 Banner；按 sortOrder 排序；0 张隐藏区域，1 张不轮播，多张默认每 5 秒循环；支持手动切换，离开页面停止。点击按配置跳内部页面或受支持外链；无目标则不可点；图片失败使用占位，失效目标给出提示。\n【待确认】轮播间隔、尺寸/数量/指示器、配置来源、地区或状态定向、外链规则。"}],"updatedAt":"2026-09-30T09:01:06.520610+00:00"},"mine":{"title":"我的","group":"我的","origin":"导航图示，内容补充","goal":"集中管理个人记录和页面设置。","interactions":["我的首页展示眠宝形象、记录与个人资料入口，以及任务提醒设置和通用设置入口。","设置页可保存消息通知偏好，进入用户协议、退出登录和注销账号。","退出登录保留本地记录；注销经二次输入确认后清除本地记录，页面修改意见仍保留在项目文件。"],"data":"authStatus：active / signed-out / closed；保存在当前浏览器。\nsettings：medTime、napMinutes、notificationEnabled。","pending":"正式账户、患者身份、授权管理和云端同步未设计。","logic":"active 显示资料、记录与设置入口；signed-out / closed 显示重新进入状态卡片。\n退出保留本地记录；注销清除记录与设置，保留写入 index.html 的修改意见。","modules":[{"title":"个人形象与账户状态","description":"顶部显示眠宝形象和当前账户状态。","fields":"authStatus：active / signed-out / closed。\n正式建议 userId、sessionStatus、patientRole、eligibilityStatus、profileSummary；与浏览器 authStatus 区分。","logic":"退出或注销后展示相应状态及重新进入按钮。\n\n【E01｜现状】退出/注销仅控制本地访问，不是真实用户身份认证。\n【建议规则（待确认）】退出清除认证会话，账号健康数据按已确认缓存策略处理；换账号不能读上个账号数据；登录过期先确认登录再恢复来源操作；注销不得通过普通重新进入恢复已删除账号记录。\n【待确认】登录方式、用户/家属范围、资格、跨设备同步、退出缓存、登录恢复。"},{"title":"我的服务","description":"我的记录、个人资料与消息通知入口。","fields":"各入口目标页面与记录数量。\n服务计数按 userId 及 records 统一类别；消息 unreadCount 按真实未读列表计算。","logic":"点击进入对应列表或说明页。\n\n【C10/E01/E04｜建议规则（待确认）】服务列表按本用户有效记录汇总，不混入其他账号；消息中心区分空列表/加载失败；记录入口与首页“全部记录”采用同一范围。\n【待确认】记录清单、个人资料可编辑字段和消息服务范围。"},{"title":"偏好与账户","description":"任务提醒设置及通用设置入口。","fields":"settings、authStatus。\n建议 settingsVersion、consentVersion、authStatus；各设置共享数据源。","logic":"通用设置内处理通知偏好、协议、退出与注销。\n\n【B04/E01｜建议规则（待确认）】提醒偏好统一，授权状态与偏好分开；退出和注销是不同流程；清除浏览器数据不能视为正式注销完成。\n【待确认】通知机制、协议确认时机、注销认证及处理反馈。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。"}],"updatedAt":"2026-09-30T09:01:06.520615+00:00"},"med":{"title":"服药打卡","group":"首页 · 今日任务","origin":"交互补充","goal":"记录患者是否已按自己的医嘱完成用药，并回看近期记录。","interactions":["点击“记录已按医嘱服药”生成一条时间记录。","点击“修改提醒”进入计划设置。","同日可补充记录；首页底部弹窗则仅在今日未记录时新增一条。"],"data":"meds[]：id、day、time、note；settings.medTime：HH:mm。","pending":"漏服与补服指导必须依据获批资料和个体医嘱审核。","logic":"点击记录追加一条本地记录；首页 hasToday 由任一当日记录决定。\n漏服补服指引不由当前页面生成。","modules":[{"title":"今日服药状态","description":"展示计划时间、今日完成状态和服药记录按钮。","fields":"settings.medTime、meds[].day/time。\n建议记录字段：recordId、userId、taskId、occurredAt、createdAt、recordDate、source、isBackfill；当前 day/time/note 保留用于现状说明。","logic":"点击记录写入当前时间；修改提醒进入用药提醒页。\n\n【B01/B03｜现状】服药页每次点击追加一条，首页弹窗同日去重；两入口行为不统一。“补记”没有实际发生时间输入。\n【建议规则（待确认）】若计划为每日一次，按 userId + taskId + recordDate 唯一；已完成禁用重复记录。补记使用实际服药时间，创建时间单独保存；超过今天的时间不得提交；重复请求返回已有记录。若多次用药，按计划次数独立记录。\n【待确认】实际每日次数、补记范围、是否允许未按计划记录、错误记录编辑/删除。两个入口须调用相同记录规则。"},{"title":"最近记录","description":"按时间倒序展示近期服药记录。","fields":"meds[]：day、time、note。\n建议排序字段：occurredAt DESC、createdAt DESC、recordId；支持日期范围和分页参数。","logic":"无记录时显示空状态。\n\n【C01/C10｜现状】只展示最近保存的 8 条，未提供全量记录或纠错入口。\n【建议规则（待确认）】按实际服药时间倒序，保存时间作次排序；补录旧日期不会置顶为最新服药。有效记录数量驱动任务，删除/修改后重算对应日期。\n【待确认】全部历史入口、编辑/删除权限与期限、无记录提示及历史过滤范围。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。\n【已确认｜二级导航】本页面隐藏底部五项一级导航栏，内容区占用释放的底部空间；使用顶部返回按钮回到来源页。仅首页、专病管理、眠宝帮你、权益中心、我的显示底部导航。"}],"updatedAt":"2026-09-30T09:01:06.520617+00:00"},"medReminder":{"title":"用药提醒","group":"首页 · 快捷服务","origin":"页面意见补充","goal":"让用户维护每日用药提醒时间与通知偏好。","interactions":["从首页快捷服务进入；调整提醒时间和通知开关。","保存后返回首页，今日用药卡片显示新的计划时间。"],"data":"settings.medTime：HH:mm，必填。\nsettings.notificationEnabled：布尔值，与“我的→设置”共用。","pending":"系统级通知、订阅授权和实际送达服务待接入。","logic":"保存时合并 settings，不覆盖小憩时长。\n首页今日用药卡片读取 medTime；通知开关仅记录偏好，实际通知须接入授权与发送服务。","modules":[{"title":"提醒时间","description":"设置每日计划用药时间。","fields":"settings.medTime：HH:mm，必填。\n建议提醒计划：planId、timezone、effectiveFrom、plannedTimes、enabled；medTime 为当前单次计划字段。","logic":"保存后首页今日用药卡片读取新时间。\n\n【B03/B04｜现状】仅保存计划值；修改会同步首页，不发送系统通知。\n【建议规则（待确认）】校验合法 HH:mm；保存成功后替换旧计划并取消未发送旧提醒；新计划从确认生效日期起执行；只对未完成任务发送，失败不影响任务记录。多入口设置写入同一配置。\n【待确认】单次/多次计划、开始生效时间、时区、任务完成后的提醒撤销、渠道/频率与失败重试。"},{"title":"通知偏好","description":"开关与“我的→设置”共用通知偏好。","fields":"settings.notificationEnabled：布尔值。\n建议区分 notificationPreference（业务意愿）与 notificationPermission（平台授权状态）。","logic":"保存偏好时保留小憩时长；系统通知需独立接入。\n\n【B04｜建议规则（待确认）】开启偏好后主动请求对应提醒授权；拒绝不标为可送达，展示授权状态与重新授权路径。关闭后取消后续提醒，不删除用药计划；消息发送服务与页面保存结果分开反馈。\n【待确认】小程序订阅类型/有效次数、可发消息模板、系统权限变化时刷新方式、重试上限与静默时间。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。\n【已确认｜二级导航】本页面隐藏底部五项一级导航栏，内容区占用释放的底部空间；使用顶部返回按钮回到来源页。仅首页、专病管理、眠宝帮你、权益中心、我的显示底部导航。"}],"updatedAt":"2026-09-30T09:01:06.520621+00:00"},"nap":{"title":"小憩时钟","group":"首页 / 专病管理","origin":"交互补充","goal":"帮助患者按照自己的计划进行短暂休息，并留下时长记录。","interactions":["开始、暂停或继续倒计时。","点击“结束并记录”保存本次小憩。","返回时查看当日次数和最近记录。"],"data":"settings.napMinutes：1–120；naps[]：id、day、time、minutes。\nnapRemaining / napStarted：页面内计时状态。","pending":"网页关闭后不会后台计时；正式提醒需系统通知能力。","logic":"开始或继续以秒递减；暂停保留剩余秒数。\n结束且已计时至少 1 秒时写入记录；关闭页面不继续后台计时。","modules":[{"title":"小憩计时","description":"显示今日次数、计划时长与倒计时；支持开始、暂停和结束。","fields":"settings.napMinutes、napRemaining、napStarted。\n建议会话字段：sessionId、plannedSecondsAtStart、startedAt、endedAt、accumulatedSeconds、remainingSeconds、status: idle/running/paused/finished/cancelled。","logic":"结束且至少计时 1 秒后写入记录；关闭页面不继续后台计时。\n\n【B03/B05｜现状】计时至少 1 秒可结束记录，分钟向上取整；到零只提示，需要手动结束；页面内切换通常继续，关闭网页不恢复。\n【建议规则（待确认）】开始固定计划秒数；暂停不累计；结束按实际有效秒数记录，不能按被修改后的计划反推。页面切换继续并按时间戳重算；计时到零进入 finished 待确认；结束按钮同会话只保存一次。取消不生成完成记录。\n【待确认】后台/刷新是否恢复、自动保存或确认、最短有效时长与取整、跨午夜归属、真实闹钟渠道。正式时长保留秒数，显示分钟与任务有效判断分别处理。"},{"title":"小憩记录","description":"展示近期小憩时长与发生时间。","fields":"naps[]：day、time、minutes。\n建议历史字段：recordId、sessionId、startedAt、endedAt、actualSeconds、recordDate、createdAt。","logic":"保存后即时更新今日次数与记录列表。\n\n【B05/C01/C10｜建议规则（待确认）】按结束时间倒序展示，保留开始/结束及实际时长；只统计已确认有效会话，不含暂停或取消会话；补记/纠错后重算任务。提供全量历史，近期区仅摘要。\n【待确认】是否允许人工补录、编辑、删除；是否纳入“全部记录”；最短有效会话和跨日计数。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据写入。\n【E06｜说明版本】“现状”描述当前界面；“建议规则（待确认）”是开发方案供业务确认；“待实现”只指说明中的新模块。旧页面通用规则与本模块建议冲突时先确认再实现，不能视为中间页面已经变更。\n【已确认｜二级导航】本页面隐藏底部五项一级导航栏，内容区占用释放的底部空间；使用顶部返回按钮回到来源页。仅首页、专病管理、眠宝帮你、权益中心、我的显示底部导航。"}],"updatedAt":"2026-09-30T09:01:06.520623+00:00"},"eventForm":{"title":"新增猝倒记录","group":"专病管理 · 猝倒","origin":"交互补充","goal":"快速保留一次事件的发生时间，再补充关键场景。","interactions":["发生时间必填，可填写持续时间、诱因和现场情况。","表单不显示“有跌倒或受伤”选项。","从专病首页弹窗保存后留在当前页，独立表单保存后进入记录列表；趋势同步更新。"],"data":"time：必填 datetime-local；duration：0–120 分钟可选；trigger、note：可选。","pending":"图片提出语音病历；录音、转写、分享权限尚未接入。","logic":"提交时校验 time 可解析；写入 events[] 后刷新日、周、月统计。\n从专病首页弹窗提交后留在本页；独立表单提交后进入记录列表。","modules":[{"title":"猝倒事件信息","description":"记录发生时间、持续时间、可能诱因和当时情况。","fields":"time 必填；duration、trigger、note 可选。\n建议统一字段：occurredAt、createdAt、updatedAt、durationMinutes（空与 0 区分）、triggerCode、note；服务端与客户端同样校验。","logic":"时间需可解析；允许事后补记。\n\n【C01/C02｜现状】持续时间输入 0–120；时间只校验可解析，未限制未来；“可稍后补充”暂无编辑路径。\n【建议规则（待确认）】发生时间不晚于当前；可补录历史。空时长代表未填写，0 不等于未填写；若采用分钟，明确是否允许小数。备注建议最多 1000 字；同用户同发生时间提示重复，确认后是否允许并存由业务决定。\n【待确认】持续时长上下限与单位、历史范围、未来容差、诱因选项、重叠/重复事件处理。仍不增加已移除的跌倒或受伤字段。"},{"title":"提交与返回","description":"保存事件并返回来源页面或记录列表。","fields":"events[]：id、time、day、duration、trigger、note。\n建议记录：recordId、userId、occurredAt、createdAt、updatedAt、version；请求携带幂等键。","logic":"从底部弹窗提交后关闭弹窗；独立页面提交后进入记录列表。\n\n【C02/E02/E03｜建议规则（待确认）】提交中禁用按钮；成功只写一条，刷新日/周/月统计；失败保留输入并允许重试，不跳转。底部提交关闭弹窗留在来源页；独立提交进入列表。关闭/离开未保存表单先确认。编辑更新原记录并重算旧日期与新日期统计。\n【待确认】是否提供编辑入口、可修改范围、重复提交提示、语音转写是否本期；语音若接入需录音授权/转写确认，未确认文本不自动保存。\n\n【E02/E03｜通用建议（待确认）】存在保存/删除/查询时，加载、成功、失败和空数据分别显示；失败保留输入或原数据，不伪造完成。重复请求使用记录级标识去重；未保存离开提示；新增/修改/删除成功刷新依赖统计。只读页面无额外数据
